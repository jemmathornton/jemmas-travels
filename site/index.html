<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, noai, noimageai">
<!-- Content Security Policy (her decision, 22 Nov): the browser runs only this site's own files; nothing from other sites.
     blob: pictures are the Write page's photo previews; data: is allowed for pictures only. Before any script. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'">
<title>Jemma’s Travels</title>
<meta name="theme-color" content="#ECF1EA" data-dark="#15212C">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<!-- the family's shared code, one copy in Jemma’s Journals (site/family/, her decision 22 Nov): light or dark set before the page is drawn
     (always opens light; localStorage "jj-mode" shared by all her sites; the old "jt-mode" moved over once), the footer, Back to top and
     the Menu drawer. js/family-load.js writes the three tags here: /family/mode.js (data-old-key jt-mode), /family/family.css and
     /family/family.js (deferred); opened as a file, the same from ../../site/family/ (round 5 review: no failed requests, no flash). -->
<script src="js/family-load.js?v=5457c249"></script>
<link rel="stylesheet" href="site.css?v=87f3d3d9">
</head>
<body>
<a class="skip" href="#view">Skip to the page</a>
<!-- narrow screens (900px and below, the family rules): a slim bar with Menu on the left and the name; the sidebar becomes a drawer from the left -->
<div class="topbar" id="topbar"><button class="menu-btn jj-menu-btn" id="menuBtn" type="button" aria-expanded="false" aria-controls="side"></button><a class="brand-bar jj-bar-name" href="#/">Jemma’s <em>Travels</em></a></div>
<div class="scrim jj-scrim" id="scrim" hidden></div>
<div class="shell">
  <header class="side jj-drawer" id="side">
    <div class="side-top">
      <a class="home-link jj-home-link" href="/" data-jj-home>← Jemma’s Journals</a>
      <a class="brand" href="#/"><b>Jemma’s <em>Travels</em></b></a>
    </div>
    <nav class="nav" id="nav" aria-label="Travels"></nav>
  </header>
  <!-- the page itself is <main>; the footer sits beside it, not inside (a landmark inside another: round 5 review) -->
  <div class="main" id="main">
    <main class="wrap" id="view" tabindex="-1"></main>
    <!-- bottom of every page: the family footer (site/family/, the same on all her sites): the name, line 1 (the same words on every site,
         put in by family.js), Travels’ own credits, then Back to top and Dark/Light mode (family.js adds the words and icons and wires them) -->
    <footer class="jj-foot" id="foot" role="contentinfo"><b class="jj-name">Jemma’s Travels</b>
      <p data-jj-line1>No cookies, no tracking, no ads. Made with HTML, CSS, JavaScript and Python, kept on GitHub.</p>
      <p data-jj-credits><span class="cr">Photos are my own</span><span class="dot" aria-hidden="true">&nbsp;·</span> <span class="cr">Country shapes from Natural Earth</span><span class="dot" aria-hidden="true">&nbsp;·</span> <span class="cr">Fonts: Instrument Serif and Manrope</span><span class="dot" aria-hidden="true">&nbsp;·</span> <span class="cr">Icons by Lucide</span></p>
      <div class="jj-foot-links"><a href="#top" id="topBtn" data-jj-top="#view"></a><button id="modeBtn" data-jj-mode></button></div></footer>
  </div>
</div>
<script src="js/icons.js?v=81c1fdc9"></script>
<script src="js/data.js?v=58b8520e"></script>
<script src="js/world.js?v=f3c70637"></script>

<script src="js/app.js?v=4daec328"></script>
</body>
</html>
