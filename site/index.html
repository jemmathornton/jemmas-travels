<!-- light or dark (21 Nov 2026, the family rules shared by all her sites): always opens light, dark only once she presses "Dark mode" at the
     bottom of a page; remembered in localStorage "jj-mode", one key for every site (the old "jt-mode" is moved over once).
     Set here, before the page is drawn, so it never flashes. -->
<script>try{var m=localStorage.getItem("jj-mode");if(m===null){m=localStorage.getItem("jt-mode");if(m)localStorage.setItem("jj-mode",m)}localStorage.removeItem("jt-mode");document.documentElement.setAttribute("data-mode",m==="dark"?"dark":"light");if(m==="dark")document.querySelector('meta[name="theme-color"]').setAttribute("content","#15212C")}catch(e){document.documentElement.setAttribute("data-mode","light")}</script>
<link rel="stylesheet" href="site.css?v=256d32d3">

         (line 1 the same on every site; line 2 Travels’ own credits), then Back to top and Dark/Light mode; js/app.js adds the icons and wires them -->
    <footer class="foot" id="foot" role="contentinfo"><b class="foot-name">Jemma’s Travels</b>
      <div class="about-site"><p>No cookies, no tracking, no ads. Made with HTML, CSS and JavaScript, kept on GitHub.</p>
